# raptor.conf - Low-latency configuration for Eufy T8410X (T31X + SC3338)
#
# Optimized for minimum glass-to-glass latency over WiFi.
# Target: ~55ms via WebRTC, ~150ms via RTSP with tuned client.

# ──────────────────────────────────────────────────────────────────
# System
# ──────────────────────────────────────────────────────────────────
[system]
# Sensor is driven by Thingino's kernel module (SC3338)
# video_backend = imp (default - uses Ingenic IMP SDK)

# ──────────────────────────────────────────────────────────────────
# Sensor - SC3338 (Eufy T8410X)
# ──────────────────────────────────────────────────────────────────
[sensor]
# Sensor identity — REQUIRED. rvd needs this to init the pipeline.
# T8410X ships SC3338 (some variants use sc3336/sc3235 — verify with
# `cat /proc/jz/sensor/sensor0/name` if rvd fails to start).
name = "sc3338"
i2c_addr = 0x30
i2c_bus = 0

# Resolution / framerate
width = 1920
height = 1080
fps = 30

# Enable immediate frame output from encoder (bypass internal buffering)
low_latency = true

# ──────────────────────────────────────────────────────────────────
# Video Encoder - Main stream (for RTSP/WebRTC)
# ──────────────────────────────────────────────────────────────────
[video0]
enabled = true
codec = h264
width = 1920
height = 1080
fps = 30

# GOP: shorter = faster recovery from packet loss, slightly more bandwidth
# 15 frames = 0.5 sec at 30fps (good balance for low latency)
gop = 15

# No B-frames: eliminates reorder delay
bframes = 0

# CBR for predictable bandwidth over WiFi
rcmode = cbr
bitrate = 3000

# Encoding profile: high for quality at same bitrate
profile = high

# ──────────────────────────────────────────────────────────────────
# Video Encoder - Sub stream (lower res backup)
# ──────────────────────────────────────────────────────────────────
[video1]
enabled = true
codec = h264
width = 640
height = 360
fps = 30
gop = 15
bframes = 0
rcmode = cbr
bitrate = 800
profile = baseline

# ──────────────────────────────────────────────────────────────────
# Ring Buffers - Zero-copy mode
# ──────────────────────────────────────────────────────────────────
[ring]
# Zero-copy: consumers mmap the same physical frame the encoder produced
# Eliminates per-frame memcpy (~2ms saved per frame)
refmode = true

# ──────────────────────────────────────────────────────────────────
# RTSP Server
# ──────────────────────────────────────────────────────────────────
[rtsp]
enabled = true
port = 554

# ──────────────────────────────────────────────────────────────────
# WebRTC Server (lowest latency path - ~50ms in browser)
# ──────────────────────────────────────────────────────────────────
[webrtc]
enabled = true
port = 8080
tls_cert = /etc/raptor/tls_cert.pem
tls_key = /etc/raptor/tls_key.pem

# ──────────────────────────────────────────────────────────────────
# HTTP Server (MJPEG/snapshots)
# ──────────────────────────────────────────────────────────────────
[http]
enabled = true
port = 80

# ──────────────────────────────────────────────────────────────────
# Audio
# ──────────────────────────────────────────────────────────────────
[audio]
enabled = true
codec = opus
samplerate = 16000
bitrate = 32000

# ──────────────────────────────────────────────────────────────────
# OSD (On-Screen Display) - disable for minimum latency
# ──────────────────────────────────────────────────────────────────
[osd]
enabled = false

# ──────────────────────────────────────────────────────────────────
# Recording - disabled for pure streaming use
# ──────────────────────────────────────────────────────────────────
[recording]
enabled = false

# ──────────────────────────────────────────────────────────────────
# Motion Detection - disable to save CPU for encoding
# ──────────────────────────────────────────────────────────────────
[motion]
enabled = false

# ──────────────────────────────────────────────────────────────────
# IR-Cut (auto day/night switch)
# ──────────────────────────────────────────────────────────────────
[ircut]
enabled = true

name: Build Raptor for T31 (T8410X)

on:
  push:
    branches: [t8410x-low-latency, main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git cmake make gcc g++ curl tar \
            autoconf automake libtool \
            meson ninja-build \
            pkg-config

      - name: Build Raptor for T31
        run: |
          chmod +x build-standalone.sh
          # Fix: the compy header copy loop fails when FetchContent deps
          # don't have *.h in their root. Add '|| true' to the failing cp lines.
          sed -i '/for dep in slice99 datatype99 interface99 metalang99/,/^[[:space:]]*done/{
            /cp -f.*\${dep}-src/s/$/ 2>\/dev\/null || true/
          }' build-standalone.sh
          ./build-standalone.sh t31 --release

      - name: Prepare release package
        run: |
          mkdir -p package/certs

          # Generate self-signed TLS cert for WebRTC DTLS-SRTP
          # (Thingino doesn't ship openssl CLI, so we generate at build time)
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout package/certs/tls_key.pem -out package/certs/tls_cert.pem \
            -days 3650 -nodes -batch -subj "/CN=raptor-cam"

          cp -r build/* package/
          cp t8410x/config/raptor.conf package/
          cp t8410x/deploy/local-install.sh package/
          cp t8410x/deploy/start-raptor.sh package/
          chmod +x package/local-install.sh package/start-raptor.sh
          tar -czf raptor-t31-t8410x.tar.gz -C package .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raptor-t31-t8410x
          path: raptor-t31-t8410x.tar.gz
          retention-days: 30

      - name: Upload individual binaries
        uses: actions/upload-artifact@v4
        with:
          name: raptor-binaries
          path: build/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/t8410x-low-latency'

    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: raptor-t31-t8410x

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Raptor T31 Build #${{ github.run_number }}"
          body: |
            Automated build of Raptor Streaming System for T31 (Eufy T8410X).

            ## Install (manual)
            1. Download `raptor-t31-t8410x.tar.gz` to your PC
            2. Extract it
            3. Copy the extracted folder to the camera (scp or SD card)
            4. On the camera, run:
               ```sh
               sh local-install.sh
               ```

            ## Streaming
            - WebRTC (lowest latency): `http://<camera_ip>/webrtc`
            - RTSP: `rtsp://<camera_ip>/stream0`
          files: raptor-t31-t8410x.tar.gz
          draft: false
          prerelease: true
